services:
  spa:
    build: .
    image: ghcr.io/iamfuhui/sat-pass-alert:${SPA_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SPA_BIND_IP:-0.0.0.0}:${SPA_PORT:-18473}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://spa:${DB_PASSWORD:?Set DB_PASSWORD}@db:3306/spa?charset=utf8mb4
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      BARK_SERVER_URL: ${BARK_SERVER_URL:-https://api.day.app}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - spa_data:/app/data
    stop_grace_period: 40s
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: spa
      MARIADB_USER: spa
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  spa_data:
  db_data:
