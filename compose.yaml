services:
  spa:
    build: .
    image: ghcr.io/iamfuhui/sat-pass-alert:${SPA_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SPA_BIND_IP:-127.0.0.1}:${SPA_PORT:-18473}:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/spa.db
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      BARK_SERVER_URL: ${BARK_SERVER_URL:-https://api.day.app}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    mem_limit: ${SPA_MEMORY_LIMIT:-0}
    volumes:
      - spa_data:/app/data
    stop_grace_period: 40s
volumes:
  spa_data:
