name: CI
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root
          MARIADB_DATABASE: spa_test
          MARIADB_USER: spa
          MARIADB_PASSWORD: test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: MariaDB migration and integration tests
        env:
          TEST_DATABASE_URL: mysql+pymysql://spa:test-password@127.0.0.1:3306/spa_test
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Compose smoke test
        env:
          APP_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
          ADMIN_PASSWORD: ci-only-admin-password
          DB_PASSWORD: ci-db-password
          DB_ROOT_PASSWORD: ci-root-password
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail http://localhost:18473/healthz
          curl --fail http://localhost:18473/
          docker compose down -v
